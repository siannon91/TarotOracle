<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hocus Pocus</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Tarot Oracle</h1>
        <nav>
            <button id="spread-btn">Daily Spread</button>
            <button id="archive-btn">Tarot Archive</button>
        </nav>
    </header>
   
    <main>
        <section id="spread-section">
            <h2>Spread</h2>
            <select id="deck-select">
                <option value="all">Full Tarot Deck</option>
                <option value="major">Major Arcana Only</option>
            </select>
            <button id="draw-btn">Draw Spread</button>
        
            <div id="spread-container">
                <div class="spread-card-slot">
                    <h4>PAST</h4>
                    <div class="card-flip-container">
                        <img src="img/retro.jpg" alt="Card back" class="static-card-back">
                    </div>
                </div>

                <div class="spread-card-slot">
                    <h4>PRESENT</h4>
                    <div class="card-flip-container">
                        <img src="img/retro.jpg" alt="Card back" class="static-card-back">
                    </div>
                </div>

                <div class="spread-card-slot">
                    <h4>FUTURE</h4>
                    <div class="card-flip-container">
                        <img src="img/retro.jpg" alt="Card back" class="static-card-back">
                    </div>
                </div>
            </div>
        </section>

        <section id="archive-section" style="display: none;">
            <h2>Tarot Archive</h2>
            <div>
                <label for="archive-filter">Filter by: </label>
                <select id="archive-filter">
                    <option value="all">All Cards</option>
                    <option value="major">Major Arcana</option>
                    <option value="wands">Wands</option>
                    <option value="cups">Cups</option>
                    <option value="swords">Swords</option>
                    <option value="pentacles">Pentacles</option>
                </select>
            </div>
            <div id="archive-container"></div>
        </section>
    </main>
</body>
</html>
